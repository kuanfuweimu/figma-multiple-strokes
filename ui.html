<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;height:auto;min-height:0}body{font-family:var(--font-family);color:var(--figma-color-text);background:var(--figma-color-bg)}
#status{padding:12px 16px;box-sizing:border-box;width:100%;overflow-wrap:anywhere}#status,#selection{display:block;font-size:11px;line-height:1.5;white-space:normal}#selection{padding:12px 16px 0}fig-footer{border-top:1px solid var(--figma-color-border)}fig-button{width:100%}
[hidden]{display:none!important}.palette-actions{display:flex;gap:8px;padding:8px 16px}.palette-hint{padding:0 16px 12px;font-size:11px;line-height:1.5}</style><script>
try{localStorage.getItem('x')}catch(e){const m=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>m.get(k)||null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k),clear:()=>m.clear(),key:i=>Array.from(m.keys())[i]||null,get length(){return m.size}}})}
</script></head><body><div id="plugin-root">
<div id="selection">Connecting to Figma…</div>
<fig-button id="read" type="button">Read selection</fig-button><fig-content>
<fig-group name="Strokes">
<fig-field><label>Count</label><fig-input-number id="count" min="1" max="12" step="1" value="4"></fig-input-number></fig-field>
<fig-field><label>Weight (px)</label><fig-input-number id="weight" min="0.5" max="80" step="0.5" value="4"></fig-input-number></fig-field>
<fig-field><label>Gap (px)</label><fig-input-number id="gap" min="0" max="80" value="4"></fig-input-number></fig-field>
<fig-field><label>Offset (px)</label><fig-input-number id="offset" min="0" max="80" value="4"></fig-input-number></fig-field>
<fig-field><label>Join</label><fig-dropdown id="join"><option>Round</option><option>Miter</option><option>Bevel</option></fig-dropdown></fig-field>
</fig-group>
<fig-group name="Color">
<fig-field><label>Mode</label><fig-dropdown id="mode"><option>Alternating</option><option>Single</option><option>Gradient</option></fig-dropdown></fig-field>
<fig-field><label>Color 1</label><fig-input-color id="color1" picker="figma-native" value="#000000"></fig-input-color></fig-field>
<fig-field><label>Color 2</label><fig-input-color id="color2" picker="figma-native" value="#F8CF00"></fig-input-color></fig-field>
<fig-field id="color-row-3" hidden><label>Color 3</label><fig-input-color id="color3" picker="figma-native" value="#FFFFFF"></fig-input-color></fig-field>
<fig-field id="color-row-4" hidden><label>Color 4</label><fig-input-color id="color4" picker="figma-native" value="#FFFFFF"></fig-input-color></fig-field>
<fig-field id="color-row-5" hidden><label>Color 5</label><fig-input-color id="color5" picker="figma-native" value="#FFFFFF"></fig-input-color></fig-field>
<fig-field id="color-row-6" hidden><label>Color 6</label><fig-input-color id="color6" picker="figma-native" value="#FFFFFF"></fig-input-color></fig-field>
<fig-field id="color-row-7" hidden><label>Color 7</label><fig-input-color id="color7" picker="figma-native" value="#FFFFFF"></fig-input-color></fig-field>
<fig-field id="color-row-8" hidden><label>Color 8</label><fig-input-color id="color8" picker="figma-native" value="#FFFFFF"></fig-input-color></fig-field>
<fig-field id="color-row-9" hidden><label>Color 9</label><fig-input-color id="color9" picker="figma-native" value="#FFFFFF"></fig-input-color></fig-field>
<fig-field id="color-row-10" hidden><label>Color 10</label><fig-input-color id="color10" picker="figma-native" value="#FFFFFF"></fig-input-color></fig-field>
<fig-field id="color-row-11" hidden><label>Color 11</label><fig-input-color id="color11" picker="figma-native" value="#FFFFFF"></fig-input-color></fig-field>
<fig-field id="color-row-12" hidden><label>Color 12</label><fig-input-color id="color12" picker="figma-native" value="#FFFFFF"></fig-input-color></fig-field>
<div class="palette-actions"><fig-button id="add-color" type="button">Add color</fig-button><fig-button id="remove-color" type="button" disabled>Remove last</fig-button></div>
<div class="palette-hint">Colors run from the innermost to the outermost stroke. Single uses Color 1.</div>
</fig-group>
</fig-content><div id="status" role="status">Editable vectors. Transparent gaps. Original preserved.</div><fig-footer sticky><fig-button id="run" type="submit" disabled>Apply</fig-button></fig-footer>
</div><script>
(function multipleStrokesPanel(){
 function showFailure(error){
  var message='Panel error: '+(error&&error.message?error.message:String(error));
  var target=document.getElementById('selection');
  if(target)target.textContent=message;
  console.error('[Multiple strokes]',error);
 }
 window.addEventListener('error',function(event){showFailure(event.error||event.message)});
 window.addEventListener('unhandledrejection',function(event){showFailure(event.reason)});
 function mount(){
  try {


const $=id=>document.getElementById(id),post=m=>parent.postMessage({pluginMessage:m},'*');
$('selection').textContent='Panel ready. Connecting to Figma…';
let valid=false,busy=false,update=false,connected=false,attempts=0;
let selectionMessage='Connecting to Figma…';
let lastSelectionId=null,terminal=false;
function hex(v){return '#'+String(v).trim().replace(/^#/,'').toUpperCase()}
let colorCount=2;
const colorIds=Array.from({length:12},(_,i)=>'color'+(i+1));
function toggleDisabled(id,disabled){$(id).disabled=disabled;if(disabled)$(id).setAttribute('disabled','');else $(id).removeAttribute('disabled');}
function updatePalette(){
 for(let i=3;i<=12;i++){const row=$('color-row-'+i);if(i>colorCount)row.setAttribute('hidden','');else row.removeAttribute('hidden');}
 toggleDisabled('add-color',busy||colorCount>=12);toggleDisabled('remove-color',busy||colorCount<=2);
}
function fill(s){
 for(const k of ['count','weight','gap','offset','mode','join'])if(s[k]!==undefined)$(k).value=String(s[k]);
 const colors=Array.isArray(s.colors)?s.colors:[s.color1,s.color2];
 colorCount=Math.max(2,Math.min(12,colors.length));
 for(let i=0;i<colorCount;i++)$(colorIds[i]).value=colors[i]||'#FFFFFF';
 updatePalette();
}
$('add-color').addEventListener('click',()=>{if(busy||colorCount>=12)return;colorCount++;$(colorIds[colorCount-1]).value='#FFFFFF';updatePalette();canRun();});
$('remove-color').addEventListener('click',()=>{if(busy||colorCount<=2)return;colorCount--;updatePalette();canRun();});
updatePalette();
function readSettings(){
 const s={};
 for(const k of ['count','weight','gap','offset'])s[k]=Number($(k).value);
 for(const k of ['mode','join'])s[k]=String($(k).value);
 s.colors=colorIds.slice(0,colorCount).map(k=>hex($(k).value));
 s.color1=s.colors[0];s.color2=s.colors[1];
 return s;
}
function inputError(){
 const s=readSettings();
 for(const [k,min,max]of [['count',1,12],['weight',.5,80],['gap',0,80],['offset',0,80]])
  if(!Number.isFinite(s[k])||s[k]<min||s[k]>max)return k+' must be between '+min+' and '+max+'.';
 for(const c of s.colors)if(!/^#[0-9a-f]{6}$/i.test(c))return 'Enter a six-digit hex color.';
 if(!['Single','Alternating','Gradient'].includes(s.mode))return 'Choose a color mode.';
 if(!['Round','Miter','Bevel'].includes(s.join))return 'Choose a stroke join.';
 return '';
}
function canRun(){
 updatePalette();const error=inputError(),ok=connected&&valid&&!busy&&!error;
 $('run').disabled=!ok;
 if(ok)$('run').removeAttribute('disabled');else $('run').setAttribute('disabled','');
 if(!busy&&error)$('status').textContent=error;
}
$('run').addEventListener('click',()=>{
 canRun();if($('run').hasAttribute('disabled'))return;
 terminal=false;busy=true;$('status').textContent='Sending Apply request…';canRun();post({type:'run',settings:readSettings()});
});
$('read').addEventListener('click',()=>{post({type:'ready'});});
for(const k of ['count','weight','gap','offset','mode','join',...colorIds])
 for(const event of ['change','input'])$(k).addEventListener(event,()=>{if(!busy)$('status').textContent='Editable vectors. Transparent gaps. Original preserved.';canRun();});
window.addEventListener('message',e=>{
 const m=e.data&&e.data.pluginMessage;if(!m)return;
 if(m.type==='connected'||m.type==='selection')connected=true;
 if(m.type==='selection'){
  const changed=m.nodeId!==lastSelectionId;lastSelectionId=m.nodeId;
  if(changed&&!busy)terminal=false;
  valid=m.valid;update=!!m.update;if(m.settings)fill(m.settings);
  selectionMessage=valid?(update?'Result: ':'Source: ')+m.name:m.message;
  $('selection').textContent=selectionMessage;
  $('run').textContent=update?'Apply changes':'Apply';
  if(!busy&&!terminal)$('status').textContent=valid?'Editable vectors. Transparent gaps. Original preserved.':m.message;
 }
 if(m.type==='busy'){busy=true;$('status').textContent='Building vectors…';}
 if(m.type==='progress'){$('status').textContent=m.message;}
 if(m.type==='success'||m.type==='error'){busy=false;terminal=true;$('status').textContent=m.message;}
 canRun();
});
// Selection handshake must not depend on customElements registration.
post({type:'ready'});
const handshake=setInterval(()=>{
 if(connected){clearInterval(handshake);return;}
 if(++attempts>=10){clearInterval(handshake);$('selection').textContent='Connection not ready. Click Read selection to retry.';return;}
 post({type:'ready'});
},500);
if(typeof ResizeObserver!=='undefined'){
 let last=0;new ResizeObserver(()=>{
  const h=Math.ceil($('plugin-root').getBoundingClientRect().height);
  if(h>0&&h!==last){last=h;post({type:'resize',height:h});}
 }).observe($('plugin-root'));
}

  }catch(error){showFailure(error)}
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount,{once:true});
 else mount();
})();
</script></body></html>
